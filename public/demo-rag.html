<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG 前端演示 — 离线可用</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #0f1117; color: #e2e8f0; min-height: 100vh; }
    header { background: linear-gradient(135deg, #1e40af, #7c3aed);
             padding: 20px 32px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 20px; font-weight: 700; }
    header span { font-size: 13px; opacity: 0.8; }
    .badge { background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 99px; font-size: 12px; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: calc(100vh - 68px); }
    .panel { padding: 20px; overflow-y: auto; border-right: 1px solid #1e293b; }
    .panel:last-child { border-right: none; }
    h2 { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
         color: #64748b; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    h2 .dot { width: 8px; height: 8px; border-radius: 50%; }
    textarea, input[type=text] {
      width: 100%; background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
      border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none;
      transition: border-color 0.2s; font-family: inherit; resize: vertical; }
    textarea:focus, input[type=text]:focus { border-color: #6366f1; }
    button { cursor: pointer; border: none; border-radius: 8px; font-size: 13px;
             font-weight: 600; padding: 9px 18px; transition: all 0.15s; }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-sm { padding: 5px 12px; font-size: 12px; background: #334155; color: #94a3b8; }
    .btn-sm:hover { background: #475569; color: white; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px;
            padding: 12px 14px; margin-bottom: 10px; }
    .card-meta { font-size: 11px; color: #64748b; margin-top: 6px; }
    .chip { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px;
            background: #0f172a; border: 1px solid #334155; color: #94a3b8; margin-right: 4px; }
    .empty { text-align: center; padding: 40px 20px; color: #475569; font-size: 14px; }
    .search-result { background: #1e293b; border: 1px solid #334155; border-radius: 10px;
                     padding: 12px 14px; margin-bottom: 10px; position: relative; }
    .search-result.rank-1 { border-color: #6366f1; }
    .search-result.rank-2 { border-color: #8b5cf6; }
    .search-result.rank-3 { border-color: #a78bfa55; }
    .score-bar { height: 4px; border-radius: 2px; background: #0f172a; margin-top: 8px; overflow: hidden; }
    .score-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #6366f1, #8b5cf6);
                  transition: width 0.6s ease; }
    .rank-badge { position: absolute; top: 10px; right: 12px; background: #6366f1;
                  color: white; border-radius: 4px; font-size: 11px; font-weight: 700;
                  padding: 2px 7px; }
    .prompt-box { background: #0f172a; border: 1px solid #6366f155; border-radius: 8px;
                  padding: 14px; font-size: 13px; line-height: 1.7; color: #94a3b8;
                  white-space: pre-wrap; word-break: break-word; margin-top: 14px; }
    .prompt-box .hl-system { color: #f59e0b; }
    .prompt-box .hl-context { color: #34d399; }
    .prompt-box .hl-question { color: #60a5fa; }
    .divider { border: none; border-top: 1px solid #1e293b; margin: 16px 0; }
    .stats { display: flex; gap: 16px; margin-bottom: 14px; }
    .stat { background: #1e293b; border-radius: 8px; padding: 8px 14px; text-align: center; }
    .stat-num { font-size: 22px; font-weight: 700; color: #6366f1; }
    .stat-label { font-size: 11px; color: #64748b; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .processing { color: #f59e0b; font-size: 12px; margin-top: 6px; }
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      .panel { border-right: none; border-bottom: 1px solid #1e293b; }
    }
  </style>
</head>
<body>
<header>
  <div style="font-size:24px">📚</div>
  <div>
    <h1>RAG 前端演示</h1>
    <span>Retrieval-Augmented Generation &nbsp;|&nbsp; 离线可用，无需 API Key</span>
  </div>
  <div style="margin-left:auto"><span class="badge">TF-IDF Embedding</span></div>
</header>

<div class="layout">
  <!-- 左侧：知识库管理 -->
  <div class="panel">
    <h2><span class="dot" style="background:#6366f1"></span>知识库</h2>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="docCount">0</div><div class="stat-label">文档数</div></div>
      <div class="stat"><div class="stat-num" id="vocabCount">0</div><div class="stat-label">词汇量</div></div>
    </div>

    <textarea id="newDoc" rows="3" placeholder="粘贴或输入一段知识，回车添加到知识库..."></textarea>
    <div class="row">
      <button class="btn-primary" onclick="addDoc()" style="flex:1">添加文档</button>
      <button class="btn-sm" onclick="clearDocs()">清空</button>
      <button class="btn-sm" onclick="loadPreset()">加载示例</button>
    </div>
    <div id="processing" class="processing" style="display:none">⚙️ 正在更新向量索引...</div>

    <hr class="divider" />
    <div id="docList"><div class="empty">知识库为空，点击「加载示例」快速开始</div></div>
  </div>

  <!-- 右侧：搜索 & 结果 -->
  <div class="panel">
    <h2><span class="dot" style="background:#8b5cf6"></span>语义搜索</h2>
    <input type="text" id="queryInput" placeholder="输入问题，如：Vue 和 React 有什么区别？" />
    <div class="row" style="margin-top:8px">
      <button class="btn-primary" onclick="doSearch()" style="flex:1">🔍 检索相关段落</button>
    </div>

    <hr class="divider" />
    <div id="searchResults">
      <div class="empty">在左侧添加文档后，在此输入问题进行检索</div>
    </div>
  </div>
</div>

<script>
// ── TF-IDF Embedder ───────────────────────────────────────────────────────────
class Embedder {
  constructor() { this.vocab = new Map(); this.docTokens = []; }

  tokenize(text) {
    // 中文按字切，英文按空格和标点切
    return text.toLowerCase()
      .replace(/[，。！？、；：""''（）【】《》\n\r]/g, ' ')
      .split(/[\s,.!?;:()\[\]{}<>/"'`|\\@#$%^&*+=~]+/)
      .flatMap(w => {
        // 中文字符单独作为 token
        const cjk = w.match(/[一-鿿]/g) || [];
        const eng = w.replace(/[一-鿿]/g, '').trim();
        return [...cjk, ...(eng ? [eng] : [])];
      })
      .filter(w => w.length > 0);
  }

  addDoc(text) {
    const tokens = this.tokenize(text);
    tokens.forEach(t => { if (!this.vocab.has(t)) this.vocab.set(t, this.vocab.size); });
    this.docTokens.push(tokens);
    return this.docTokens.length - 1;
  }

  rebuildVocab() {
    this.vocab.clear();
    this.docTokens.forEach(tokens => {
      tokens.forEach(t => { if (!this.vocab.has(t)) this.vocab.set(t, this.vocab.size); });
    });
  }

  embed(text) {
    const tokens = this.tokenize(text);
    const tf = new Map();
    tokens.forEach(t => tf.set(t, (tf.get(t) || 0) + 1));

    const size = this.vocab.size;
    if (size === 0) return [];
    const vec = new Array(size).fill(0);

    tf.forEach((count, term) => {
      const idx = this.vocab.get(term);
      if (idx === undefined) return;
      const docsWithTerm = this.docTokens.filter(d => d.includes(term)).length;
      const idf = Math.log((this.docTokens.length + 1) / (docsWithTerm + 1)) + 1;
      vec[idx] = (count / tokens.length) * idf;
    });
    return vec;
  }
}

function cosine(a, b) {
  if (!a.length || !b.length || a.length !== b.length) return 0;
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
  return na && nb ? dot / (Math.sqrt(na) * Math.sqrt(nb)) : 0;
}

// ── 状态 ──────────────────────────────────────────────────────────────────────
const embedder = new Embedder();
let knowledgeBase = []; // { text, tokens }

const PRESET = [
  'Vue 是一个渐进式 JavaScript 框架，由尤雨溪创建，采用响应式数据绑定和组件化开发，适合构建单页应用。',
  'React 是 Meta（Facebook）开发的前端 UI 库，使用虚拟 DOM 和 JSX 语法，通过 Hooks 管理状态，拥有庞大的生态系统。',
  'Transformers.js 是 HuggingFace 推出的浏览器端机器学习库，支持 WASM 和 WebGPU 后端，可以在浏览器中直接运行 NLP 模型。',
  'RAG（检索增强生成）是一种 AI 技术，先从知识库检索相关文档片段，再将其拼入 Prompt 让大模型生成答案，有效减少幻觉。',
  'WebGPU 是新一代浏览器图形和计算 API，比 WebGL 性能更高，可以直接操作 GPU 进行 AI 推理加速，Chrome 113+ 支持。',
  'IndexedDB 是浏览器内置的 NoSQL 数据库，支持存储大量结构化数据，事务操作，适合离线应用和本地向量库存储。',
  'Vercel AI SDK 提供 useChat 和 useCompletion 两个 React Hook，简化了前端对接流式 LLM API 的开发工作。',
  'Function Calling（工具调用）允许 LLM 在生成回答时声明需要调用某个工具，由前端或后端实际执行后把结果返回给模型。',
  'ONNX Runtime Web 支持在浏览器中运行 ONNX 格式的模型，支持 WASM 和 WebGPU 两种后端，适合部署自定义训练的模型。',
  'WebLLM 由 MLC AI 团队开发，利用 WebGPU 在浏览器中运行完整的 LLM（如 Llama、Qwen），支持流式输出和对话记忆。',
];

function loadPreset() {
  PRESET.forEach(text => addDocInternal(text));
}

function addDocInternal(text) {
  const t = text.trim();
  if (!t) return;
  embedder.addDoc(t);
  knowledgeBase.push({ text: t });
  updateStats();
  renderDocs();
}

window.addDoc = function() {
  const el = document.getElementById('newDoc');
  const text = el.value.trim();
  if (!text) return;
  showProcessing(true);
  setTimeout(() => {
    addDocInternal(text);
    el.value = '';
    showProcessing(false);
  }, 100);
};

window.clearDocs = function() {
  if (!confirm('确定清空知识库？')) return;
  knowledgeBase = [];
  embedder.vocab.clear();
  embedder.docTokens.length = 0;
  updateStats();
  renderDocs();
  document.getElementById('searchResults').innerHTML = '<div class="empty">知识库已清空</div>';
};

function showProcessing(v) {
  document.getElementById('processing').style.display = v ? 'block' : 'none';
}

function updateStats() {
  document.getElementById('docCount').textContent = knowledgeBase.length;
  document.getElementById('vocabCount').textContent = embedder.vocab.size;
}

function renderDocs() {
  const el = document.getElementById('docList');
  if (knowledgeBase.length === 0) {
    el.innerHTML = '<div class="empty">知识库为空，点击「加载示例」快速开始</div>';
    return;
  }
  el.innerHTML = knowledgeBase.map((doc, i) => {
    // 提取关键词（出现在 vocab 里频率较高的 token）
    const tokens = embedder.docTokens[i];
    const freq = new Map();
    tokens.forEach(t => freq.set(t, (freq.get(t) || 0) + 1));
    const keywords = [...freq.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([w]) => w);

    return `<div class="card">
      <div style="font-size:13px;line-height:1.6">${doc.text}</div>
      <div class="tag-row">${keywords.map(k => `<span class="chip">${k}</span>`).join('')}</div>
      <div class="card-meta">文档 #${i + 1} &nbsp;·&nbsp; ${tokens.length} 个 token</div>
    </div>`;
  }).join('');
}

window.doSearch = function() {
  const query = document.getElementById('queryInput').value.trim();
  const resultsEl = document.getElementById('searchResults');

  if (!query) { resultsEl.innerHTML = '<div class="empty">请输入搜索问题</div>'; return; }
  if (knowledgeBase.length === 0) { resultsEl.innerHTML = '<div class="empty">知识库为空，请先添加文档</div>'; return; }

  // 把查询词加入词表（不存入文档列表）
  const qTokens = embedder.tokenize(query);
  qTokens.forEach(t => { if (!embedder.vocab.has(t)) embedder.vocab.set(t, embedder.vocab.size); });
  // 重建所有向量
  embedder.rebuildVocab();
  const qVec = embedder.embed(query);

  const ranked = knowledgeBase
    .map((doc, i) => ({ ...doc, idx: i, score: cosine(qVec, embedder.embed(doc.text)) }))
    .sort((a, b) => b.score - a.score)
    .slice(0, 3);

  const topScore = ranked[0].score || 1;
  const context = ranked.map(r => r.text).join('\n\n');
  const prompt = `你是一个知识助手。请根据以下资料回答用户的问题。\n\n【参考资料】\n${context}\n\n【用户问题】\n${query}`;

  resultsEl.innerHTML = `
    <div style="margin-bottom:14px">
      ${ranked.map((r, i) => `
        <div class="search-result rank-${i+1}">
          <span class="rank-badge">#${i+1}</span>
          <div style="font-size:13px;line-height:1.6;padding-right:40px">${r.text}</div>
          <div class="score-bar"><div class="score-fill" style="width:0%" data-w="${(r.score/topScore*100).toFixed(1)}%"></div></div>
          <div class="card-meta" style="margin-top:4px">
            文档 #${r.idx + 1} &nbsp;·&nbsp; 相似度：<strong style="color:#6366f1">${(r.score*100).toFixed(1)}%</strong>
          </div>
        </div>
      `).join('')}
    </div>

    <h2><span class="dot" style="background:#34d399"></span>构建好的 RAG Prompt</h2>
    <div class="prompt-box"><span class="hl-system">你是一个知识助手。请根据以下资料回答用户的问题。</span>

<span class="hl-context">【参考资料】
${ranked.map(r => r.text).join('\n\n')}</span>

<span class="hl-question">【用户问题】
${query}</span></div>
    <div style="font-size:12px;color:#475569;margin-top:8px">⬆️ 实际项目中把这段 Prompt 发给 LLM（如 Claude / GPT）即可得到基于知识库的回答</div>
  `;

  // 动画展开进度条
  setTimeout(() => {
    document.querySelectorAll('.score-fill').forEach(el => {
      el.style.width = el.dataset.w;
    });
  }, 50);
};

// 监听回车
document.getElementById('queryInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
document.getElementById('newDoc').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) addDoc();
});
</script>
</body>
</html>
